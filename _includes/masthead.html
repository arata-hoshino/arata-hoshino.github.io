<header class="masthead">
  <a class="masthead-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <p class="masthead-subtitle">{{ site.subtitle }}</p>

  <nav class="toc" aria-label="Table of contents">
    <a href="{{ '/' | relative_url }}"
       class="toc-link{% if page.url == '/' %} is-current{% endif %}">Introduction</a>
    {% assign essays = site.essays | sort: "order" %}
    {% for essay in essays %}
      <a href="{{ essay.url | relative_url }}"
         class="toc-link{% if page.url == essay.url %} is-current{% endif %}">{% if essay.number %}{{ essay.number }}. {% endif %}{{ essay.title }}</a>
    {% endfor %}
    <a href="{{ '/about/' | relative_url }}"
       class="toc-link{% if page.url == '/about/' %} is-current{% endif %}">About</a>
  </nav>
</header>
