---
layout: default
---

<article class="page">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
  {% if page.deck %}<p class="page-deck">{{ page.deck }}</p>{% endif %}

  {% if page.meta %}
    <table class="meta">
      {% for row in page.meta %}
        <tr><th scope="row">{{ row.label }}</th><td>{{ row.value }}</td></tr>
      {% endfor %}
    </table>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>
</article>
