title: "The Far Side of the Constraint"
author: "Arata Hoshino"
tagline: "Energy abundance, physical automation, and the distribution of ownership"
description: "A thesis by Arata Hoshino on the one structural constraint behind stagnation, falling births, and artificial intelligence running into a wall of electricity."
url: "https://arata-hoshino.github.io"
baseurl: ""
lang: "en"

markdown: kramdown
permalink: pretty

kramdown:
  input: GFM
  auto_ids: true
  footnote_backlink: "↩"
  syntax_highlighter: rouge

collections:
  essays:
    output: true
    permalink: /essays/:name/

defaults:
  - scope:
      path: ""
      type: essays
    values:
      layout: essay

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
