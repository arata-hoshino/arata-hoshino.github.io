title: "Far Side of the Constraint"
author: "Arata Hoshino"
tagline: "Energy abundance, physical automation, and the distribution of ownership"
description: "A thesis by Arata Hoshino on the one structural constraint behind stagnation, falling births, and artificial intelligence running into a wall of electricity."
url: "https://arata-hoshino.github.io"
baseurl: ""
lang: "en"

markdown: kramdown
permalink: pretty

# two chapters were renamed after they had been posted; their old addresses
# are kept alive rather than broken
plugins:
  - jekyll-redirect-from

kramdown:
  input: GFM
  auto_ids: true
  footnote_backlink: "↩"
  syntax_highlighter: rouge

# the thesis has moved to aratahoshino.com: nothing below is served, and
# every address falls through to 404.html, which says where it went. The
# sources stay, so turning output back on and taking the entries out of
# exclude brings the site back as it was.
collections:
  essays:
    output: false
    permalink: /essays/:name/

defaults:
  - scope:
      path: ""
      type: essays
    values:
      layout: essay

exclude:
  - index.md
  - about.md
  - assets/figures
  - assets/the-far-side-of-the-constraint.pdf
  - assets/js
  - assets/fonts/README.md
  - README.md
  - tools
  - drafts
  - Gemfile
  - Gemfile.lock
  - vendor
